[project]
name = "zuse"
version = "0.1.0"
description = "Differential verification harness for COBOL-to-Java migration (PRISM Hackathon MVP)"
requires-python = ">=3.11"
dependencies = [
    "rich",
    "requests",
]

[project.optional-dependencies]
backend = [
    "fastapi",
    "uvicorn",
]

[project.scripts]
zuse = "zuse.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["zuse*"]
