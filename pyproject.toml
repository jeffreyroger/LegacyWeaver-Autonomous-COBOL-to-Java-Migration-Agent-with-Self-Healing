[project]
name = "legacyweaver-mvp"
version = "0.1.0"
description = "Differential verification harness for COBOL-to-Java migration (PRISM Hackathon MVP)"
requires-python = ">=3.11"
dependencies = [
    "rich",
    "requests",
]

[project.scripts]
weaver = "weaver.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["weaver*"]
